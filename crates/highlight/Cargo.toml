[package]
name = "highlight"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Owned syntax-highlight theme layer over lumis, for stele"

[lib]
name = "highlight"
path = "src/lib.rs"

[dependencies]
layout = { path = "../layout" }
lumis = { version = "=0.12.0", default-features = false, features = [
    "lang-rust",
    "lang-python",
    "lang-javascript",
    "lang-typescript",
    "lang-go",
    "lang-c",
    "lang-cpp",
    "lang-java",
    "lang-csharp",
    "lang-ruby",
    "lang-swift",
    "lang-kotlin",
    "lang-zig",
    "lang-bash",
    "lang-json",
    "lang-yaml",
    "lang-toml",
    "lang-html",
    "lang-css",
    "lang-sql",
] }

toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
ast = { path = "../ast" }
