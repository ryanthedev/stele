[package]
name = "math"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RaTeX-backed math rendering with a txm text-grid fallback"

[dependencies]
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
ratex-render = { version = "0.1.13", features = ["embed-fonts"] }
ratex-types = "0.1.13"
txm = "0.1.5"
unicode-width = "0.2"

[dev-dependencies]
# Test-only: decoding rendered PNGs to assert on ink color/transparency
# (DW-6.2/ratex.md's contrast check). Already a transitive dependency of
# `ratex-render`; declared directly here since edition 2024 resolves the
# extern prelude from direct dependencies only.
png = "0.18"
# Test-only: DW-6.2's fixture set is `fixtures/math.md` and
# `testdocs/02-math.md`, real markdown documents. The real parser decides
# what is a math span in them (`$5 and $10` in prose deliberately is not),
# so the test extracts formulas with it rather than with a hand-rolled
# scanner that would disagree with the shipped product. `ast` is a leaf
# crate with no dependencies of its own and none on `math`, so this adds no
# cycle and nothing to the shipped binary.
ast = { path = "../ast" }
# Test-only: the shipped pipeline finishes a formula's raster in
# `gfx::decode::letterbox_png` (see `render_fitted`), and DW-6.2's
# "exactly the cell box" property is a property of the *composition*, not of
# either half. Asserting it here is what keeps it next to the fixture corpus.
# `gfx` does not depend on `math`, so this adds no cycle, and a dev-dependency
# is never linked into the shipped binary.
gfx = { path = "../gfx" }
