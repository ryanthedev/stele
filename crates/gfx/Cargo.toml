[package]
name = "gfx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Owned kitty graphics-protocol emission and bounded image decode"

[dependencies]
# Chunked base64 payload encoding for kitty's `a=t` transmission (spec caps
# each chunk at 4096 base64 bytes).
base64 = "0.22"
# Decode + header-only dimension probe for local image files. Pure Rust
# codecs only (no dynamic C library linkage — CI's linkage job forbids it),
# which is what rules out AVIF and HEIC: `image`'s AVIF *decoder* is
# `avif-native`, a binding to libdav1d, and there is no pure-Rust decoder for
# either format worth depending on yet. Everything below is pure Rust.
#
# Format selection is content-sniffed (`with_guessed_format` in `decode.rs`),
# never taken from the file extension, so this list *is* the supported set —
# there is no second place that agrees or disagrees with it.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    # A README's other two staples. GIF decodes to its first frame; stele has
    # no animation loop and inventing one behind an `![]()` would be a
    # surprise, not a feature.
    "gif",
    "webp",
    # Rarer in prose but free, and each is somebody's normal: BMP and ICO turn
    # up in Windows-facing docs, TIFF in anything that came off a scanner.
    "bmp",
    "ico",
    "tiff",
] }
# SVG, the one vector format on this path. Pure Rust like everything else
# here (usvg parses, tiny-skia rasterizes). Two of resvg's default features
# are deliberately off:
#
#   raster-images — lets an SVG embed a PNG/JPEG/GIF via `<image href="data:">`
#     and decode it during parsing. That is a second decoder, reached from
#     document content, that would not answer to this crate's `Limits` — the
#     one property the module exists to guarantee. An SVG that embeds a bitmap
#     renders everything except the bitmap, which is the safe half of the
#     trade and the one worth taking on a hostile-input path.
#   memmap-fonts — maps font files into the address space to load them faster.
#     `svg::fonts` loads once for the life of the process, so the speed is not
#     worth the extra surface.
resvg = { version = "0.47", default-features = false, features = [
    "text",
    "system-fonts",
] }

[dev-dependencies]
# Live-Ghostty test only (crates/gfx/tests/live_ghostty.rs); not linked into
# the shipped binary at all (dev-dependencies never are).
probe = { path = "../probe" }
