[package]
name = "layout"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure, deterministic layout: AST + width in, retained line-box tree out"

[dependencies]
ast = { path = "../ast" }
width = { path = "../width" }
# Nothing else, deliberately: the table distribution algorithm (css-tables-3
# §3.9.3, comfy-table consulted as a reference) is small enough to own, and a
# leaf crate keeps the final binary's dependency surface flat.
