[package]
name = "probe"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PTY-driven Ghostty capability probe harness"

[[bin]]
name = "spike_a"
path = "src/bin/spike_a.rs"

[dependencies]
crossterm = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
