[package]
name = "stele"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal markdown viewer for Ghostty"

[lib]
name = "stele"
path = "src/lib.rs"

[[bin]]
name = "stele"
path = "src/main.rs"

[dependencies]
ast = { path = "../ast" }
layout = { path = "../layout" }
width = { path = "../width" }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
