[package]
name = "stele"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal markdown viewer for Ghostty"

[lib]
name = "stele"
path = "src/lib.rs"

[[bin]]
name = "stele"
path = "src/main.rs"

[dependencies]
ast = { path = "../ast" }
gfx = { path = "../gfx" }
layout = { path = "../layout" }
math = { path = "../math" }
width = { path = "../width" }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# Test-only: building synthetic PNG fixtures for media-module tests.
image = { version = "0.25", default-features = false, features = ["png"] }
