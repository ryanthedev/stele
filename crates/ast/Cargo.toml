[package]
name = "ast"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Owned CommonMark+GFM parser producing a typed, span-carrying AST"

[dependencies]
# None, deliberately: the parser is a leaf crate feeding a single static binary.

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
