[package]
name = "ast-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ast = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# Standalone: never part of the stele workspace (nightly-only sanitizer
# builds must not leak into the stable fmt/clippy/test/linkage jobs).
[workspace]
