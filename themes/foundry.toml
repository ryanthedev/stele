# Foundry — light, and built for a bright room rather than a dimmed one. Ink on
# cold-pressed paper: near-black prose, structure carried by one blue that never
# competes with the words.
#
# On paper "quieter" means closer to the page, so this ramp descends toward
# white — the opposite direction from a dark theme's.
name = "Foundry"
appearance = "light"


# Every role stele can colour is set below, so this file doubles as the
# reference for what a theme may name. Delete any line to inherit the
# built-in light colour for that role instead.
#
# Some roles here merge into one another in a 256-colour terminal, and
# `stele --theme` will say which.
# That is expected and not a defect: the xterm cube offers 6 steps per
# channel, so a palette coherent enough to look like one theme cannot also
# be 33-ways distinct once quantized. Truecolor terminals — which is what
# stele targets — show every colour here exactly as written.

[colors]
# Not pure black: past every contrast bar while dodging the hard glare of
# #000 that makes long reading tiring.
text = "#252525"
emphasis = "#3f3f3f"
strong = "#101010"
strikethrough = "#737373"

# H1 is nearly navy and H6 is nearly sky, descending toward the paper.
heading1 = "#0c3968"
heading2 = "#174778"
heading3 = "#245688"
heading4 = "#336394"
heading5 = "#416d9a"
heading6 = "#4e779f"

code_inline = "#8d294b"
code_block = "#313131"

link = "#0d59b1"
image_alt = "#656565"
math = "#6f3e99"

list_marker = "#134272"
task_marker = "#1b7241"
blockquote = "#8f8f8f"

alert_note = "#106ad2"
alert_tip = "#1b8147"
alert_important = "#8344b9"
alert_warning = "#a46802"
alert_caution = "#b32222"

# Furniture, at WCAG 1.4.11's 3:1 rather than the 4.5:1 asked of words.
rule = "#868686"
table_border = "#7b7b7b"
table_header = "#0f4b88"

footnote_ref = "#9a3356"
footnote_label = "#5e5e5e"
html = "#6f6f6f"
front_matter = "#575757"
overflow = "#4674a2"

search_match = "#8f5d08"
search_current = "#9e1a1a"

# The slab a fenced code block sits on, so a reader can see where the code
# stops. cold-pressed stock: paper, one step down from white.
#
# No contrast floor applies to this colour itself — what has to stay legible
# is everything painted on it, which is what stele measures the [syntax]
# table against once this is set.
code_block_bg = "#f1efe9"

# Syntax colours, for fenced blocks a highlighter claims. Setting even one of
# these hands stele the whole block: anything left unset falls back to `text`
# rather than to stele's generated palette, so this table is all-or-nothing on
# purpose and every role below is filled in.
#
# On paper the danger is the opposite of a dark theme's — it is not illegibility
# but *noise*, a printed page with eight highlighter pens on it. So this table
# spends one hue per idea and lets everything else sit near the ink.
[syntax]
# The gaps. Near `code_block`, so a claimed fence and an unclaimed one look
# like the same block of type.
plain = "#313131"

comment = "#61705f"
comment_doc = "#4d6b4b"
punctuation = "#5f5f5f"
operator = "#7a3a10"

# Structure words, in the same blue that carries structure everywhere else in
# this theme.
keyword = "#0c3968"
keyword_control = "#1a4f8f"
label = "#2a5f7a"
attribute = "#5c4a8f"

# Names of things.
function = "#7a2f6e"
function_macro = "#96407f"
type = "#0f5c5c"
type_builtin = "#2a6f6a"
constructor = "#3d6b3d"
namespace = "#41566e"
tag = "#0d59b1"
property = "#3f5a7d"

# Literals, in the same wine `code_inline` already uses — a value looks like a
# value, and like this theme.
string = "#8d294b"
string_escape = "#a83e26"
number = "#6f3e99"
boolean = "#7d4aa8"
constant = "#5c3d8f"

variable = "#252525"
variable_builtin = "#4a4a4a"

error = "#b32222"
