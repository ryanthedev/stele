# Gruvbox Light — a port of morhetz/gruvbox.
#
# The same retro groove inverted for paper.
#
# The [syntax] table is mapped from the upstream project's own scope
# definitions (colors/gruvbox.vim), not from a house convention. These themes
# disagree with each other about what colour a keyword is far more than you
# would expect, and flattening that would make six ports that were the same
# picture in different paint.
#
# The [colors] table is not a port. Markdown roles — headings, alerts, a
# blockquote gutter — have no upstream equivalent to be faithful to, so they
# follow one convention across every theme here, drawn from this palette. The
# six heading rungs are interpolated between two of the theme's own colours:
# no editor defines a six-level ramp, and six unrelated accents would break
# the one thing the ramp is for. See docs/theming.md.
#
# NOTE: on paper louder means closer to the ink, so `*_bright` is a darkened `faded_*` rather than a `neutral_*` — the neutral tier is tuned for a dark page and washes out on a white one.
#
# Contrast is measured against stele's reference background rather than the
# upstream theme's own, because stele does not set your terminal background.
#
# This port is faithful rather than corrected, so it inherits the roles
# upstream ships below WCAG AA. stele says so in the status line every
# time you load it. Brightening them would make this a theme that merely
# resembles Gruvbox Light rather than one that is it. They are listed
# here so you can edit them if you would rather have the contrast.
#
# under-aa: syntax.attribute, syntax.comment, syntax.constructor, syntax.function, syntax.function_macro, syntax.namespace, syntax.string, syntax.type, syntax.type_builtin, table_header
# upstream: morhetz/gruvbox
name = "Gruvbox Light"
appearance = "light"

[colors]
text = "#3c3836"
emphasis = "#504945"
strong = "#282828"
strikethrough = "#7c6f64"
heading1 = "#af3a03"
heading2 = "#ab2e04"
heading3 = "#a82304"
heading4 = "#a41705"
heading5 = "#a10c05"
heading6 = "#9d0006"
code_inline = "#427b58"
code_block = "#504945"
link = "#065766"
image_alt = "#665c54"
math = "#8f3f71"
list_marker = "#af3a03"
task_marker = "#67630c"
blockquote = "#665c54"
alert_note = "#065766"
alert_tip = "#67630c"
alert_important = "#7a3660"
alert_warning = "#88580f"
alert_caution = "#850005"
rule = "#665c54"
table_border = "#665c54"
table_header = "#b57614"
footnote_ref = "#427b58"
footnote_label = "#665c54"
html = "#665c54"
front_matter = "#665c54"
overflow = "#665c54"
search_match = "#88580f"
search_current = "#953103"
code_block_bg = "#fbf1c7"

# Naming any of these hands the theme the whole code block — see
# docs/theming.md.
[syntax]
plain = "#3c3836"
comment = "#7c6f64"
comment_doc = "#665c54"
punctuation = "#504945"
operator = "#3c3836"
keyword = "#9d0006"
keyword_control = "#9d0006"
label = "#9d0006"
attribute = "#427b58"
function = "#79740e"
function_macro = "#427b58"
type = "#b57614"
type_builtin = "#b57614"
constructor = "#b57614"
namespace = "#427b58"
tag = "#076678"
property = "#076678"
string = "#79740e"
string_escape = "#af3a03"
number = "#8f3f71"
boolean = "#8f3f71"
constant = "#8f3f71"
variable = "#076678"
variable_builtin = "#af3a03"
error = "#9d0006"
