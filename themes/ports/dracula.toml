# Dracula — a port of dracula/dracula-theme.
#
# High-saturation neon on near-black. The loudest port here, and the one
# that most rewards a truecolor terminal.
#
# The [syntax] table is mapped from the upstream project's own scope
# definitions (spec.draculatheme.com), not from a house convention. These themes
# disagree with each other about what colour a keyword is far more than you
# would expect, and flattening that would make six ports that were the same
# picture in different paint.
#
# The [colors] table is not a port. Markdown roles — headings, alerts, a
# blockquote gutter — have no upstream equivalent to be faithful to, so they
# follow one convention across every theme here, drawn from this palette. The
# six heading rungs are interpolated between two of the theme's own colours:
# no editor defines a six-level ramp, and six unrelated accents would break
# the one thing the ramp is for. See docs/theming.md.
#
# Contrast is measured against stele's reference background rather than the
# upstream theme's own, because stele does not set your terminal background.
#
# This port is faithful rather than corrected, so it inherits the roles
# upstream ships below WCAG AA. stele says so in the status line every
# time you load it. Brightening them would make this a theme that merely
# resembles Dracula rather than one that is it. They are listed
# here so you can edit them if you would rather have the contrast.
#
# under-aa: strikethrough, syntax.comment
# upstream: dracula/dracula-theme
name = "Dracula"
appearance = "dark"

[colors]
text = "#f8f8f2"
emphasis = "#c5c5c0"
strong = "#ffffff"
strikethrough = "#6272a4"
heading1 = "#bd93f9"
heading2 = "#ca8eef"
heading3 = "#d789e5"
heading4 = "#e583da"
heading5 = "#f27ed0"
heading6 = "#ff79c6"
code_inline = "#8be9fd"
code_block = "#c5c5c0"
link = "#8be9fd"
image_alt = "#8b9ac4"
math = "#bd93f9"
list_marker = "#ffb86c"
task_marker = "#50fa7b"
blockquote = "#8b9ac4"
alert_note = "#8be9fd"
alert_tip = "#50fa7b"
alert_important = "#bd93f9"
alert_warning = "#f1fa8c"
alert_caution = "#ff5555"
rule = "#8b9ac4"
table_border = "#8b9ac4"
table_header = "#f1fa8c"
footnote_ref = "#8be9fd"
footnote_label = "#8b9ac4"
html = "#8b9ac4"
front_matter = "#8b9ac4"
overflow = "#8b9ac4"
search_match = "#f1fa8c"
search_current = "#ffb86c"

# Naming any of these hands the theme the whole code block — see
# docs/theming.md.
[syntax]
plain = "#f8f8f2"
comment = "#6272a4"
comment_doc = "#8b9ac4"
punctuation = "#ff79c6"
operator = "#ff79c6"
keyword = "#ff79c6"
keyword_control = "#ff79c6"
label = "#ff79c6"
attribute = "#50fa7b"
function = "#50fa7b"
function_macro = "#50fa7b"
type = "#8be9fd"
type_builtin = "#8be9fd"
constructor = "#8be9fd"
namespace = "#8be9fd"
tag = "#ff79c6"
property = "#f8f8f2"
string = "#f1fa8c"
string_escape = "#ff79c6"
number = "#bd93f9"
boolean = "#bd93f9"
constant = "#bd93f9"
variable = "#f8f8f2"
variable_builtin = "#ffb86c"
error = "#ff5555"
