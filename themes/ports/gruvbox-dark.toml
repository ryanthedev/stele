# Gruvbox Dark — a port of morhetz/gruvbox.
#
# Retro groove: warm, low-blue, high-contrast. The most-ported terminal
# palette there is.
#
# The [syntax] table is mapped from the upstream project's own scope
# definitions (colors/gruvbox.vim), not from a house convention. These themes
# disagree with each other about what colour a keyword is far more than you
# would expect, and flattening that would make six ports that were the same
# picture in different paint.
#
# The [colors] table is not a port. Markdown roles — headings, alerts, a
# blockquote gutter — have no upstream equivalent to be faithful to, so they
# follow one convention across every theme here, drawn from this palette. The
# six heading rungs are interpolated between two of the theme's own colours:
# no editor defines a six-level ramp, and six unrelated accents would break
# the one thing the ramp is for. See docs/theming.md.
#
# NOTE: gruvbox dark draws syntax from its `bright_*` tier; `neutral_*` is what the light variant uses.
#
# Contrast is measured against stele's reference background rather than the
# upstream theme's own, because stele does not set your terminal background.
#
# This port is faithful rather than corrected, so it inherits the roles
# upstream ships below WCAG AA. stele says so in the status line every
# time you load it. Brightening them would make this a theme that merely
# resembles Gruvbox Dark rather than one that is it. They are listed
# here so you can edit them if you would rather have the contrast.
#
# under-aa: syntax.comment, syntax.error, syntax.keyword, syntax.keyword_control, syntax.label
# upstream: morhetz/gruvbox
name = "Gruvbox Dark"
appearance = "dark"

[colors]
text = "#ebdbb2"
emphasis = "#d5c4a1"
strong = "#fbf1c7"
strikethrough = "#928374"
heading1 = "#fe8019"
heading2 = "#fd8c1d"
heading3 = "#fc9822"
heading4 = "#fca526"
heading5 = "#fbb12b"
heading6 = "#fabd2f"
code_inline = "#8ec07c"
code_block = "#d5c4a1"
link = "#83a598"
image_alt = "#a89984"
math = "#d3869b"
list_marker = "#fe8019"
task_marker = "#b8bb26"
blockquote = "#a89984"
alert_note = "#83a598"
alert_tip = "#b8bb26"
alert_important = "#d3869b"
alert_warning = "#fabd2f"
alert_caution = "#fb4934"
rule = "#a89984"
table_border = "#a89984"
table_header = "#fabd2f"
footnote_ref = "#8ec07c"
footnote_label = "#a89984"
html = "#a89984"
front_matter = "#a89984"
overflow = "#a89984"
search_match = "#fabd2f"
search_current = "#fe8019"
code_block_bg = "#282828"

# Naming any of these hands the theme the whole code block — see
# docs/theming.md.
[syntax]
plain = "#ebdbb2"
comment = "#928374"
comment_doc = "#a89984"
punctuation = "#d5c4a1"
operator = "#ebdbb2"
keyword = "#fb4934"
keyword_control = "#fb4934"
label = "#fb4934"
attribute = "#8ec07c"
function = "#b8bb26"
function_macro = "#8ec07c"
type = "#fabd2f"
type_builtin = "#fabd2f"
constructor = "#fabd2f"
namespace = "#8ec07c"
tag = "#83a598"
property = "#83a598"
string = "#b8bb26"
string_escape = "#fe8019"
number = "#d3869b"
boolean = "#d3869b"
constant = "#d3869b"
variable = "#83a598"
variable_builtin = "#fe8019"
error = "#fb4934"
