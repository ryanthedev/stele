# Catppuccin Mocha — a port of catppuccin/catppuccin.
#
# Pastel on a soft charcoal base. Every accent is held at a similar
# lightness, which is why its code reads as calm with twelve hues in play.
#
# The [syntax] table is mapped from the upstream project's own scope
# definitions (catppuccin/nvim groups/syntax.lua + treesitter.lua), not from a house convention. These themes
# disagree with each other about what colour a keyword is far more than you
# would expect, and flattening that would make six ports that were the same
# picture in different paint.
#
# The [colors] table is not a port. Markdown roles — headings, alerts, a
# blockquote gutter — have no upstream equivalent to be faithful to, so they
# follow one convention across every theme here, drawn from this palette. The
# six heading rungs are interpolated between two of the theme's own colours:
# no editor defines a six-level ramp, and six unrelated accents would break
# the one thing the ramp is for. See docs/theming.md.
#
# Contrast is measured against stele's reference background rather than the
# upstream theme's own, because stele does not set your terminal background.
#
# Every role here clears WCAG AA against that reference.
#
# under-aa:
# upstream: catppuccin/catppuccin
name = "Catppuccin Mocha"
appearance = "dark"

[colors]
text = "#cdd6f4"
emphasis = "#bac2de"
strong = "#f5e0dc"
strikethrough = "#7f849c"
heading1 = "#cba6f7"
heading2 = "#bea9f8"
heading3 = "#b1acf8"
heading4 = "#a3aef9"
heading5 = "#96b1f9"
heading6 = "#89b4fa"
code_inline = "#94e2d5"
code_block = "#bac2de"
link = "#74c7ec"
image_alt = "#9399b2"
math = "#cba6f7"
list_marker = "#fab387"
task_marker = "#94e2d5"
blockquote = "#9399b2"
alert_note = "#74c7ec"
alert_tip = "#94e2d5"
alert_important = "#b4befe"
alert_warning = "#fab387"
alert_caution = "#eba0ac"
rule = "#9399b2"
table_border = "#9399b2"
table_header = "#f9e2af"
footnote_ref = "#94e2d5"
footnote_label = "#9399b2"
html = "#9399b2"
front_matter = "#9399b2"
overflow = "#9399b2"
search_match = "#fab387"
search_current = "#f5c2e7"
line_number = "#7f849c"
line_number_current = "#f5e0dc"
gutter_border = "#9399b2"
code_block_bg = "#1e1e2e"
current_line_bg = "#313244"

# Naming any of these hands the theme the whole code block — see
# docs/theming.md.
[syntax]
plain = "#cdd6f4"
comment = "#9399b2"
comment_doc = "#9399b2"
punctuation = "#9399b2"
operator = "#89dceb"
keyword = "#cba6f7"
keyword_control = "#cba6f7"
label = "#74c7ec"
attribute = "#fab387"
function = "#89b4fa"
function_macro = "#f5c2e7"
type = "#f9e2af"
type_builtin = "#cba6f7"
constructor = "#f9e2af"
namespace = "#f9e2af"
tag = "#b4befe"
property = "#b4befe"
string = "#a6e3a1"
string_escape = "#f5c2e7"
number = "#fab387"
boolean = "#fab387"
constant = "#fab387"
variable = "#cdd6f4"
variable_builtin = "#f38ba8"
error = "#f38ba8"
