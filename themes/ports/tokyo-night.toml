# Tokyo Night — a port of folke/tokyonight.nvim.
#
# Neon over deep navy. Worth knowing: stele's dark reference background is
# #1a1b26, which *is* Tokyo Night's — so this port's contrast numbers are the
# ones its author intended rather than an approximation.
#
# The [syntax] table is mapped from the upstream project's own scope
# definitions (tokyonight.nvim groups/base.lua + treesitter.lua), not from a house convention. These themes
# disagree with each other about what colour a keyword is far more than you
# would expect, and flattening that would make six ports that were the same
# picture in different paint.
#
# The [colors] table is not a port. Markdown roles — headings, alerts, a
# blockquote gutter — have no upstream equivalent to be faithful to, so they
# follow one convention across every theme here, drawn from this palette. The
# six heading rungs are interpolated between two of the theme's own colours:
# no editor defines a six-level ramp, and six unrelated accents would break
# the one thing the ramp is for. See docs/theming.md.
#
# Contrast is measured against stele's reference background rather than the
# upstream theme's own, because stele does not set your terminal background.
#
# This port is faithful rather than corrected, so it inherits the roles
# upstream ships below WCAG AA. stele says so in the status line every
# time you load it. Brightening them would make this a theme that merely
# resembles Tokyo Night rather than one that is it. They are listed
# here so you can edit them if you would rather have the contrast.
#
# under-aa: footnote_label, front_matter, html, image_alt, strikethrough, syntax.comment, syntax.comment_doc
# upstream: folke/tokyonight.nvim
name = "Tokyo Night"
appearance = "dark"

[colors]
text = "#c0caf5"
emphasis = "#a9b1d6"
strong = "#c0caf5"
strikethrough = "#565f89"
heading1 = "#7aa2f7"
heading2 = "#819af1"
heading3 = "#8893eb"
heading4 = "#8f8be4"
heading5 = "#9684de"
heading6 = "#9d7cd8"
code_inline = "#7dcfff"
code_block = "#a9b1d6"
link = "#2ac3de"
image_alt = "#737aa2"
math = "#bb9af7"
list_marker = "#ff9e64"
task_marker = "#9ece6a"
blockquote = "#737aa2"
alert_note = "#2ac3de"
alert_tip = "#9ece6a"
alert_important = "#9d7cd8"
alert_warning = "#e0af68"
alert_caution = "#f7768e"
rule = "#737aa2"
table_border = "#737aa2"
table_header = "#e0af68"
footnote_ref = "#7dcfff"
footnote_label = "#737aa2"
html = "#737aa2"
front_matter = "#737aa2"
overflow = "#737aa2"
search_match = "#e0af68"
search_current = "#ff9e64"
code_block_bg = "#1a1b26"

# Naming any of these hands the theme the whole code block — see
# docs/theming.md.
[syntax]
plain = "#c0caf5"
comment = "#565f89"
comment_doc = "#737aa2"
punctuation = "#a9b1d6"
operator = "#89ddff"
keyword = "#9d7cd8"
keyword_control = "#bb9af7"
label = "#7aa2f7"
attribute = "#7dcfff"
function = "#7aa2f7"
function_macro = "#7dcfff"
type = "#2ac3de"
type_builtin = "#27a1b9"
constructor = "#bb9af7"
namespace = "#7dcfff"
tag = "#7aa2f7"
property = "#73daca"
string = "#9ece6a"
string_escape = "#bb9af7"
number = "#ff9e64"
boolean = "#ff9e64"
constant = "#ff9e64"
variable = "#c0caf5"
variable_builtin = "#f7768e"
error = "#f7768e"
