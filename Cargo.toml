[workspace]
resolver = "3"
members = [
    "crates/ast",
    "crates/gfx",
    "crates/layout",
    "crates/math",
    "crates/probe",
    "crates/stele",
    "crates/width",
]
# cargo-fuzz targets build with nightly sanitizer flags; keep them out of the
# stable workspace so fmt/clippy/test/linkage jobs never touch them.
exclude = ["crates/ast/fuzz"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
